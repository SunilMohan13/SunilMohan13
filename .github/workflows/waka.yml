name: WakaTime Readme Stats

on:
  # Update once a day
  schedule:
    - cron: "30 0 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Least privilege: the action commits the updated stats back to the repo
permissions:
  contents: write

concurrency:
  group: waka-readme
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update WakaTime stats in README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update coding activity block
        uses: athul/waka-readme@master
        with:
          # API key is read from repo secrets only (never hardcoded)
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: "true"
          BLOCKS: "->"
          TIME_RANGE: "last_7_days"
